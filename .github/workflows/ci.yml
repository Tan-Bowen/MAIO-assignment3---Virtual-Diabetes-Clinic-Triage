# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Tests
        run: pytest

      - name: Train model (Smoke Test)
        # Quick training to ensure the script runs and artifacts are created
        run: python app/train.py
        
      - name: Upload artifacts (model and metrics)
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            model.joblib

            metrics.json
